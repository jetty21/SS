name: Deploy to GitHub Pages

# OPTIONAL / manual. The simplest way to publish this static site is
# Settings -> Pages -> "Deploy from a branch" (root) -- no Actions needed.
#
# If you prefer the Actions source instead: set Settings -> Pages ->
# Source = "GitHub Actions" once (the token can't auto-create the site),
# then run this workflow from the Actions tab ("Run workflow").

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede older ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
